<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - St Clare School</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#f4f1ee;color:#222;}

.admin-header{
  background:#7a1c2e;
  color:#fff;
  padding:25px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.admin-header h1{font-size:26px;font-weight:400;}

.header-actions{display:flex;gap:12px;}

.admin-header a,
.logout-btn{
  color:#fff;
  text-decoration:none;
  border:1px solid #fff;
  padding:10px 20px;
  border-radius:30px;
  background:transparent;
  cursor:pointer;
}

.admin-header a:hover,
.logout-btn:hover{background:#fff;color:#7a1c2e;}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
  margin:30px;
}

.stat-card{
  background:#fff;
  padding:25px;
  border-left:5px solid #7a1c2e;
}

.stat-card h2{font-size:40px;color:#7a1c2e;}

.admin-main{
  padding:50px 30px;
  max-width:1300px;
  margin:auto;
}

.admin-tabs{
  display:flex;
  gap:15px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.admin-tabs button{
  padding:13px 25px;
  border:none;
  background:#fff;
  color:#7a1c2e;
  border-radius:30px;
  cursor:pointer;
}

.admin-tabs button.active{background:#7a1c2e;color:#fff;}

.admin-section{display:none;}
.admin-section.active{display:block;}

.card{
  background:#fff;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  border-left:5px solid #7a1c2e;
}

.card h3{
  color:#7a1c2e;
  margin-bottom:18px;
  font-size:24px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.info-grid p{
  background:#faf7f5;
  padding:12px;
  font-size:14px;
  line-height:1.5;
}

.info-grid strong{
  display:block;
  color:#7a1c2e;
  margin-bottom:4px;
}

.message-box{
  background:#faf7f5;
  padding:15px;
  margin-top:15px;
  line-height:1.7;
}

.message-box strong{
  color:#7a1c2e;
  display:block;
  margin-bottom:6px;
}

.document-links{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.document-links a{
  background:#7a1c2e;
  color:white;
  padding:9px 15px;
  border-radius:20px;
  text-decoration:none;
  font-size:13px;
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.action-row button{
  padding:10px 18px;
  color:#fff;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:13px;
}

.review-btn{background:#7a1c2e;}
.interview-btn{background:#1565c0;}
.accept-btn{background:#2e7d32;}
.reject-btn{background:#ef6c00;}
.print-btn{background:#444;}
.verify-btn{background:#2e7d32;}
.delete-btn{background:#c62828;}
.delete-btn:hover{background:#8e0000;}

.status-pill{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  color:#fff;
  font-size:13px;
}

.status-new{background:#c62828;}
.status-reviewed{background:#6a1b9a;}
.status-interview{background:#1565c0;}
.status-accepted{background:#2e7d32;}
.status-rejected{background:#ef6c00;}
.status-pending{background:#ef6c00;}
.status-verified{background:#2e7d32;}

.empty{
  background:#fff;
  padding:30px;
  text-align:center;
  color:#777;
}

@media(max-width:900px){
  .admin-header{flex-direction:column;gap:15px;text-align:center;}
  .stats-grid{grid-template-columns:1fr;margin:20px;}
  .info-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header class="admin-header">
  <h1>St Clare Admin Dashboard</h1>

  <div class="header-actions">
    <a href="index.html">Back</a>
    <button onclick="logoutAdmin()" class="logout-btn">Logout</button>
  </div>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <h2 id="applicationCount">0</h2>
    <p>Total Applications</p>
  </div>

  <div class="stat-card">
    <h2 id="enquiryCount">0</h2>
    <p>Total Enquiries</p>
  </div>

  <div class="stat-card">
    <h2 id="paymentCount">0</h2>
    <p>Total Payments</p>
  </div>
</div>

<main class="admin-main">

  <div class="admin-tabs">
    <button class="tab-btn active" onclick="showTab(event,'applications')">Applications</button>
    <button class="tab-btn" onclick="showTab(event,'enquiries')">Enquiries</button>
    <button class="tab-btn" onclick="showTab(event,'payments')">Payments</button>
  </div>

  <section id="applications" class="admin-section active">
    <div id="applicationsList" class="empty">Loading...</div>
  </section>

  <section id="enquiries" class="admin-section">
    <div id="enquiriesList" class="empty">Loading...</div>
  </section>

  <section id="payments" class="admin-section">
    <div id="paymentsList" class="empty">Loading...</div>
  </section>

</main>

<script>
function showTab(e, tab){
  document.querySelectorAll(".admin-section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
  e.target.classList.add("active");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3ZfrYRJ2XNfijkmaYGKTUVotGTqYX5Ds",
  authDomain: "st-clare-school.firebaseapp.com",
  projectId: "st-clare-school",
  storageBucket: "st-clare-school.firebasestorage.app",
  messagingSenderId: "980272641859",
  appId: "1:980272641859:web:0e37c8a0e5faab38afa1f6",
  measurementId: "G-4B7S4KEJFZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    location.href = "admin-login.html";
  } else {
    loadApplications();
    loadEnquiries();
    loadPayments();
  }
});

function value(data, keys) {
  for (const key of keys) {
    if (data[key]) return data[key];
  }
  return "-";
}

function getStatusClass(status){
  if (status === "Reviewed") return "status-reviewed";
  if (status === "Interview Scheduled") return "status-interview";
  if (status === "Accepted") return "status-accepted";
  if (status === "Rejected") return "status-rejected";
  if (status === "Verified") return "status-verified";
  if (status === "Pending Verification") return "status-pending";
  return "status-new";
}

/* ================= APPLICATIONS ================= */

async function loadApplications() {
  const list = document.getElementById("applicationsList");
  list.innerHTML = "Loading...";

  try {
    const snapshot = await getDocs(
      query(collection(db, "applications"), orderBy("createdAt", "desc"))
    );

    document.getElementById("applicationCount").textContent = snapshot.size;

    if (snapshot.empty) {
      list.innerHTML = "<div class='empty'>No applications</div>";
      return;
    }

    list.innerHTML = "";

    snapshot.forEach((d) => {
      const data = d.data();
      const id = d.id;
      const docs = data.documents || {};
      const currentStatus = data.status || "New";

      list.innerHTML += `
        <div class="card" id="application-card-${id}">
          <h3>${data.firstName || ""} ${data.lastName || ""}</h3>

          <div class="info-grid">
            <p><strong>Class</strong>${data.applyingClass || "-"}</p>
            <p><strong>DOB</strong>${data.dob || "-"}</p>
            <p><strong>Gender</strong>${data.gender || "-"}</p>
            <p><strong>Nationality</strong>${data.nationality || "-"}</p>
            <p><strong>Religion</strong>${data.religion || "-"}</p>
            <p><strong>Previous School</strong>${data.previousSchool || "-"}</p>
            <p><strong>Father</strong>${data.fatherName || "-"}</p>
            <p><strong>Father Occupation</strong>${data.fatherOccupation || "-"}</p>
            <p><strong>Mother</strong>${data.motherName || "-"}</p>
            <p><strong>Mother Occupation</strong>${data.motherOccupation || "-"}</p>
            <p><strong>Phone</strong>${data.phone || "-"}</p>
            <p><strong>Email</strong>${data.email || "-"}</p>
            <p><strong>Guardian</strong>${data.guardianName || "-"}</p>
            <p><strong>Guardian Phone</strong>${data.guardianPhone || "-"}</p>
            <p><strong>Village / Town</strong>${data.villageTown || "-"}</p>
            <p><strong>District</strong>${data.district || "-"}</p>
            <p><strong>State</strong>${data.state || "-"}</p>
            <p><strong>PIN Code</strong>${data.pinCode || "-"}</p>
            <p><strong>Blood Group</strong>${data.bloodGroup || "-"}</p>
            <p><strong>Medical Condition</strong>${data.medicalCondition || "-"}</p>
            <p>
              <strong>Status</strong>
              <span id="status-${id}" class="status-pill ${getStatusClass(currentStatus)}">
                ${currentStatus}
              </span>
            </p>
          </div>

          <div class="message-box">
            <strong>Permanent Address</strong>
            ${data.permanentAddress || "-"}
          </div>

          <div class="message-box">
            <strong>Present Address</strong>
            ${data.presentAddress || "-"}
          </div>

          <div class="document-links">
            ${docs.birthCertificate ? `<a href="${docs.birthCertificate}" target="_blank">Birth Certificate</a>` : ""}
            ${docs.aadhaarCard ? `<a href="${docs.aadhaarCard}" target="_blank">Aadhaar Card</a>` : ""}
            ${docs.transferCertificate ? `<a href="${docs.transferCertificate}" target="_blank">Transfer Certificate</a>` : ""}
            ${docs.marksheet ? `<a href="${docs.marksheet}" target="_blank">Marksheet</a>` : ""}
            ${docs.passportPhoto ? `<a href="${docs.passportPhoto}" target="_blank">Passport Photo</a>` : ""}
          </div>

          <div class="action-row">
            <button onclick="updateApplicationStatus('${id}', 'Reviewed')" class="review-btn">Mark Reviewed</button>
            <button onclick="updateApplicationStatus('${id}', 'Interview Scheduled')" class="interview-btn">Interview</button>
            <button onclick="updateApplicationStatus('${id}', 'Accepted')" class="accept-btn">Accept</button>
            <button onclick="updateApplicationStatus('${id}', 'Rejected')" class="reject-btn">Reject</button>
            <button onclick="printApplication('${id}')" class="print-btn">Print</button>
            <button onclick="deleteApplication('${id}')" class="delete-btn">Delete</button>
          </div>
        </div>
      `;
    });

  } catch (error) {
    console.error(error);
    list.innerHTML = "<div class='empty'>Failed to load applications</div>";
  }
}

/* ================= ENQUIRIES ================= */

async function loadEnquiries() {
  const list = document.getElementById("enquiriesList");
  list.innerHTML = "Loading...";

  try {
    const snapshot = await getDocs(
      query(collection(db, "enquiries"), orderBy("createdAt", "desc"))
    );

    document.getElementById("enquiryCount").textContent = snapshot.size;

    if (snapshot.empty) {
      list.innerHTML = "<div class='empty'>No enquiries</div>";
      return;
    }

    list.innerHTML = "";

    snapshot.forEach((d) => {
      const data = d.data();
      const id = d.id;

      const fullName =
        data.name ||
        `${data.firstName || ""} ${data.lastName || ""}`.trim() ||
        "No Name";

      list.innerHTML += `
        <div class="card">
          <h3>${fullName}</h3>

          <div class="info-grid">
            <p><strong>Email</strong>${value(data, ["email", "studentEmail"])}</p>
            <p><strong>Phone</strong>${value(data, ["phone", "mobile", "contact", "contactNumber"])}</p>
            <p><strong>Class / Grade</strong>${value(data, ["grade", "class", "applyingClass", "yearGroup"])}</p>
            <p><strong>Parent Name</strong>${value(data, ["parentName", "fatherName", "motherName", "guardianName"])}</p>
            <p><strong>Student Name</strong>${value(data, ["studentName", "childName"])}</p>
            <p><strong>Address</strong>${value(data, ["address", "location"])}</p>
            <p><strong>Admission Type</strong>${value(data, ["admissionType", "enquiryType"])}</p>
            <p><strong>Preferred Contact</strong>${value(data, ["preferredContact", "contactMethod"])}</p>
            <p><strong>Status</strong>${value(data, ["status"])}</p>
          </div>

          <div class="message-box">
            <strong>Message / Enquiry Details</strong>
            ${value(data, ["message", "enquiry", "details", "question"])}
          </div>

          <div class="action-row">
            <button onclick="deleteEnquiry('${id}')" class="delete-btn">Delete Enquiry</button>
          </div>
        </div>
      `;
    });

  } catch (error) {
    console.error(error);
    list.innerHTML = "<div class='empty'>Failed to load enquiries</div>";
  }
}

/* ================= PAYMENTS ================= */

async function loadPayments() {
  const list = document.getElementById("paymentsList");
  list.innerHTML = "Loading...";

  try {
    const snapshot = await getDocs(
      query(collection(db, "payments"), orderBy("createdAt", "desc"))
    );

    document.getElementById("paymentCount").textContent = snapshot.size;

    if (snapshot.empty) {
      list.innerHTML = "<div class='empty'>No payment records</div>";
      return;
    }

    list.innerHTML = "";

    snapshot.forEach((d) => {
      const data = d.data();
      const id = d.id;
      const status = data.status || "Pending Verification";

      list.innerHTML += `
        <div class="card" id="payment-card-${id}">
          <h3>${data.studentName || "Payment Record"}</h3>

          <div class="info-grid">
            <p><strong>Student Name</strong>${data.studentName || "-"}</p>
            <p><strong>Class</strong>${data.className || "-"}</p>
            <p><strong>Parent / Guardian</strong>${data.parentName || "-"}</p>
            <p><strong>Phone</strong>${data.phone || "-"}</p>
            <p><strong>Purpose</strong>${data.purpose || "-"}</p>
            <p><strong>Amount</strong>₹${data.amount || "-"}</p>
            <p><strong>Transaction ID</strong>${data.transactionId || "-"}</p>
            <p><strong>Payment Date</strong>${data.paymentDate || "-"}</p>
            <p>
              <strong>Status</strong>
              <span id="payment-status-${id}" class="status-pill ${getStatusClass(status)}">
                ${status}
              </span>
            </p>
          </div>

          <div class="document-links">
            ${data.screenshotUrl ? `<a href="${data.screenshotUrl}" target="_blank">View Payment Screenshot</a>` : ""}
          </div>

          <div class="action-row">
            <button onclick="verifyPayment('${id}')" class="verify-btn">Verify Payment</button>
            <button onclick="printReceipt('${id}')" class="print-btn">Print Receipt</button>
            <button onclick="deletePayment('${id}')" class="delete-btn">Delete Payment</button>
          </div>
        </div>
      `;
    });

  } catch (error) {
    console.error(error);
    list.innerHTML = "<div class='empty'>Failed to load payment records</div>";
  }
}

/* ================= UPDATE APPLICATION STATUS ================= */

window.updateApplicationStatus = async (id, status) => {
  try {
    await updateDoc(doc(db, "applications", id), { status });

    const statusEl = document.getElementById(`status-${id}`);
    statusEl.innerText = status;
    statusEl.className = `status-pill ${getStatusClass(status)}`;

    alert(`Application status updated to ${status}`);

  } catch (error) {
    console.error(error);
    alert("Failed to update application status.");
  }
};

/* ================= VERIFY PAYMENT ================= */

window.verifyPayment = async (id) => {
  try {
    await updateDoc(doc(db, "payments", id), {
      status: "Verified",
      receiptStatus: "Issued"
    });

    const statusEl = document.getElementById(`payment-status-${id}`);
    statusEl.innerText = "Verified";
    statusEl.className = "status-pill status-verified";

    alert("Payment verified. Receipt can now be printed.");

  } catch (error) {
    console.error(error);
    alert("Failed to verify payment.");
  }
};

/* ================= PRINT APPLICATION ================= */

window.printApplication = (id) => {
  const card = document.getElementById(`application-card-${id}`);
  if (!card) return alert("Application not found.");

  const originalContents = document.body.innerHTML;

  document.body.innerHTML = `
    <div style="padding:40px;font-family:Arial,sans-serif;">
      <div style="text-align:center;border-bottom:3px solid #7a1c2e;padding-bottom:20px;margin-bottom:30px;">
        <h1 style="color:#7a1c2e;margin-bottom:10px;">St Clare Higher Secondary School</h1>
        <p>Student Admission Application Form</p>
      </div>

      ${card.innerHTML}

      <div style="margin-top:80px;display:flex;justify-content:space-between;">
        <div style="width:220px;border-top:1px solid #222;text-align:center;padding-top:10px;">Parent Signature</div>
        <div style="width:220px;border-top:1px solid #222;text-align:center;padding-top:10px;">Principal Signature</div>
      </div>
    </div>
  `;

  document.querySelectorAll(".action-row,.document-links").forEach(el => {
    el.style.display = "none";
  });

  window.print();
  document.body.innerHTML = originalContents;
  location.reload();
};

/* ================= PRINT PAYMENT RECEIPT ================= */

window.printReceipt = (id) => {
  const card = document.getElementById(`payment-card-${id}`);
  if (!card) return alert("Payment record not found.");

  const originalContents = document.body.innerHTML;

  document.body.innerHTML = `
    <div style="padding:40px;font-family:Arial,sans-serif;">
      <div style="text-align:center;border-bottom:3px solid #7a1c2e;padding-bottom:20px;margin-bottom:30px;">
        <h1 style="color:#7a1c2e;margin-bottom:10px;">St Clare Higher Secondary School</h1>
        <p>Official Payment Receipt</p>
        <p>Receipt generated after school verification</p>
      </div>

      ${card.innerHTML}

      <div style="margin-top:80px;display:flex;justify-content:space-between;">
        <div style="width:220px;border-top:1px solid #222;text-align:center;padding-top:10px;">Parent / Guardian</div>
        <div style="width:220px;border-top:1px solid #222;text-align:center;padding-top:10px;">Accounts Office</div>
      </div>
    </div>
  `;

  document.querySelectorAll(".action-row,.document-links").forEach(el => {
    el.style.display = "none";
  });

  window.print();
  document.body.innerHTML = originalContents;
  location.reload();
};

/* ================= DELETE ================= */

window.deleteApplication = async (id) => {
  if (!confirm("Are you sure you want to delete this application?")) return;

  try {
    await deleteDoc(doc(db, "applications", id));
    loadApplications();
  } catch (error) {
    alert("Failed to delete application.");
  }
};

window.deleteEnquiry = async (id) => {
  if (!confirm("Are you sure you want to delete this enquiry?")) return;

  try {
    await deleteDoc(doc(db, "enquiries", id));
    loadEnquiries();
  } catch (error) {
    alert("Failed to delete enquiry.");
  }
};

window.deletePayment = async (id) => {
  if (!confirm("Are you sure you want to delete this payment record?")) return;

  try {
    await deleteDoc(doc(db, "payments", id));
    loadPayments();
  } catch (error) {
    alert("Failed to delete payment record.");
  }
};

/* ================= LOGOUT ================= */

window.logoutAdmin = async () => {
  await signOut(auth);
  location.href = "admin-login.html";
};
</script>

</body>
</html>
