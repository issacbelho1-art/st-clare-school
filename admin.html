<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - St Clare School</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f4f1ee;color:#222;}

.admin-header{
  background:#7a1c2e;color:#fff;padding:25px 40px;
  display:flex;justify-content:space-between;align-items:center;
}
.admin-header h1{font-size:26px;font-weight:400;}

.header-actions{display:flex;gap:12px;}
.admin-header a,.logout-btn{
  color:#fff;text-decoration:none;border:1px solid #fff;
  padding:10px 20px;border-radius:30px;background:transparent;
  cursor:pointer;
}
.admin-header a:hover,.logout-btn:hover{
  background:#fff;color:#7a1c2e;
}

.admin-main{padding:50px 30px;max-width:1300px;margin:auto;}

.admin-tabs{display:flex;gap:15px;margin-bottom:30px;}
.admin-tabs button{
  padding:13px 25px;border:none;background:#fff;
  color:#7a1c2e;border-radius:30px;cursor:pointer;
}
.admin-tabs button.active{background:#7a1c2e;color:#fff;}

.admin-section{display:none;}
.admin-section.active{display:block;}

.card{
  background:#fff;padding:28px;margin-bottom:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  border-left:5px solid #7a1c2e;
}

.info-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
}
.info-grid p{background:#faf7f5;padding:10px;font-size:14px;}

.message-box{
  background:#faf7f5;padding:12px;margin-top:12px;
}

.review-btn{
  margin-top:15px;padding:10px 18px;
  background:#7a1c2e;color:#fff;border:none;
  border-radius:25px;cursor:pointer;
}

.empty{background:#fff;padding:30px;text-align:center;color:#777;}

.stats-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:25px;margin:30px;
}
.stat-card{
  background:#fff;padding:25px;
  border-left:5px solid #7a1c2e;
}
.stat-card h2{font-size:40px;color:#7a1c2e;}
</style>
</head>

<body>

<header class="admin-header">
  <h1>St Clare Admin Dashboard</h1>
  <div class="header-actions">
    <a href="index.html">Back</a>
    <button onclick="logoutAdmin()" class="logout-btn">Logout</button>
  </div>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <h2 id="applicationCount">0</h2>
    <p>Total Applications</p>
  </div>
  <div class="stat-card">
    <h2 id="enquiryCount">0</h2>
    <p>Total Enquiries</p>
  </div>
</div>

<main class="admin-main">

<div class="admin-tabs">
  <button class="tab-btn active" onclick="showTab(event,'applications')">Applications</button>
  <button class="tab-btn" onclick="showTab(event,'enquiries')">Enquiries</button>
</div>

<section id="applications" class="admin-section active">
  <div id="applicationsList" class="empty">Loading...</div>
</section>

<section id="enquiries" class="admin-section">
  <div id="enquiriesList" class="empty">Loading...</div>
</section>

</main>

<script>
function showTab(e, tab){
  document.querySelectorAll(".admin-section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
  e.target.classList.add("active");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3ZfrYRJ2XNfijkmaYGKTUVotGTqYX5Ds",
  authDomain: "st-clare-school.firebaseapp.com",
  projectId: "st-clare-school",
  storageBucket: "st-clare-school.firebasestorage.app",
  messagingSenderId: "980272641859",
  appId: "1:980272641859:web:0e37c8a0e5faab38afa1f6",
  measurementId: "G-4B7S4KEJFZ"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="admin-login.html";
  } else {
    loadApplications();
    loadEnquiries();
  }
});

// ✅ APPLICATIONS
async function loadApplications(){
  const list=document.getElementById("applicationsList");
  list.innerHTML="Loading...";

  const snapshot=await getDocs(query(collection(db,"applications"),orderBy("createdAt","desc")));
  document.getElementById("applicationCount").textContent=snapshot.size;

  if(snapshot.empty){
    list.innerHTML="<div class='empty'>No applications</div>";
    return;
  }

  list.innerHTML="";

  snapshot.forEach(d=>{
    const data=d.data();
    const id=d.id;

    // ✅ FIXED STATUS COLOR
    const statusColor = data.status === "Reviewed" ? "green" : "red";

    list.innerHTML+=`
    <div class="card">
      <h3>${data.firstName || ""} ${data.lastName || ""}</h3>

      <div class="info-grid">
        <p><strong>Class</strong>${data.applyingClass || "-"}</p>
        <p><strong>DOB</strong>${data.dob || "-"}</p>
        <p><strong>Gender</strong>${data.gender || "-"}</p>

        <p><strong>Father</strong>${data.fatherName || "-"}</p>
        <p><strong>Mother</strong>${data.motherName || "-"}</p>
        <p><strong>Phone</strong>${data.phone || "-"}</p>

        <p><strong>Email</strong>${data.email || "-"}</p>

        <p>
          <strong>Status</strong>
          <span id="status-${id}" style="color:${statusColor}">
            ${data.status || "New"}
          </span>
        </p>
      </div>

      <button onclick="markReviewed('${id}',this)" class="review-btn">
        Mark Reviewed
      </button>
    </div>`;
  });
}

// ✅ ENQUIRIES
async function loadEnquiries(){
  const list=document.getElementById("enquiriesList");

  const snapshot=await getDocs(query(collection(db,"enquiries"),orderBy("createdAt","desc")));
  document.getElementById("enquiryCount").textContent=snapshot.size;

  list.innerHTML="";

  snapshot.forEach(d=>{
    const data=d.data();

    list.innerHTML+=`
    <div class="card">
      <h3>${data.firstName || ""}</h3>
      <div class="info-grid">
        <p><strong>Email</strong>${data.email}</p>
        <p><strong>Phone</strong>${data.phone}</p>
        <p><strong>Grade</strong>${data.grade}</p>
      </div>
    </div>`;
  });
}

// ✅ MARK REVIEWED
window.markReviewed = async(id,btn)=>{
  await updateDoc(doc(db,"applications",id),{status:"Reviewed"});

  document.getElementById(`status-${id}`).innerText="Reviewed";
  document.getElementById(`status-${id}`).style.color="green";

  btn.innerText="Reviewed";
  btn.disabled=true;
};

// LOGOUT
window.logoutAdmin = async()=>{
  await signOut(auth);
  location.href="admin-login.html";
};
</script>

</body>
</html>
