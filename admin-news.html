<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News Management - St Clare Admin</title>

<link rel="stylesheet" href="admin-news.css">
</head>

<body>

<header class="admin-header">

  <h1>St Clare News Admin</h1>

  <div class="header-actions">
    <a href="admin.html">Back to Dashboard</a>
  </div>

</header>

<section class="news-admin">

  <h2>Publish School News</h2>

  <p>
    Publish school news, announcements, admission updates,
    achievements, events and notices.
  </p>

  <form id="newsForm">

    <div class="form-grid">

      <div class="form-group">
        <label>News Title</label>

        <input
          type="text"
          id="title"
          placeholder="Example: Class 11 Admission Open"
          required
        >
      </div>

      <div class="form-group">
        <label>Category</label>

        <select id="category">
          <option>General</option>
          <option>Admission</option>
          <option>Event</option>
          <option>Achievement</option>
          <option>Notice</option>
          <option>Sports</option>
          <option>Academic</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload News Image</label>

        <input
          type="file"
          id="newsImage"
          accept="image/*"
        >
      </div>

      <div class="form-group full">
        <label>News Content</label>

        <textarea
          id="content"
          placeholder="Write full news content here..."
          required
        ></textarea>
      </div>

    </div>

    <button type="submit" id="submitBtn">
      Publish News
    </button>

    <div id="statusMessage" class="status-message"></div>

  </form>

  <div class="published-news">

    <h2>Published News</h2>

    <div id="newsList">
      Loading news...
    </div>

  </div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  query,
  orderBy,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyC97WiF96Rx2_NH-6jz0vMP0LqyowgDMAc",
  authDomain: "st-clare-website.firebaseapp.com",
  projectId: "st-clare-website",
  storageBucket: "st-clare-website.firebasestorage.app",
  messagingSenderId: "505543741254",
  appId: "1:505543741254:web:206b1ccbd6c5a17f655f47",
  measurementId: "G-08EEWQFN19"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);

const newsForm = document.getElementById("newsForm");

const submitBtn = document.getElementById("submitBtn");

const statusMessage = document.getElementById("statusMessage");

const newsList = document.getElementById("newsList");

/* ================= STATUS MESSAGE ================= */

function showMessage(message, type) {

  statusMessage.textContent = message;

  statusMessage.className =
    "status-message " + type;
}

/* ================= IMAGE UPLOAD ================= */

async function uploadNewsImage(file) {

  if (!file) return "";

  const fileName =
    `news/${Date.now()}_${file.name}`;

  const storageRef = ref(storage, fileName);

  await uploadBytes(storageRef, file);

  return await getDownloadURL(storageRef);
}

/* ================= SUBMIT NEWS ================= */

newsForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const content =
    document.getElementById("content").value.trim();

  const imageFile =
    document.getElementById("newsImage").files[0];

  if (!title || !content) {

    showMessage(
      "Please fill in title and content.",
      "error"
    );

    return;
  }

  submitBtn.disabled = true;

  submitBtn.textContent = "Publishing...";

  try {

    let imageUrl = "";

    if (imageFile) {
      imageUrl = await uploadNewsImage(imageFile);
    }

    await addDoc(collection(db, "news"), {

      title,
      category,
      content,

      imageUrl,

      status: "Published",

      createdAt: serverTimestamp()
    });

    showMessage(
      "News published successfully!",
      "success"
    );

    newsForm.reset();

    loadNews();

  } catch (error) {

    console.error(error);

    showMessage(
      "Failed to publish news.",
      "error"
    );

  } finally {

    submitBtn.disabled = false;

    submitBtn.textContent = "Publish News";
  }

});

/* ================= LOAD NEWS ================= */

async function loadNews() {

  try {

    const q = query(
      collection(db, "news"),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {

      newsList.innerHTML = `
        <div class="empty">
          No news published yet.
        </div>
      `;

      return;
    }

    newsList.innerHTML = "";

    snapshot.forEach((newsDoc) => {

      const data = newsDoc.data();

      const date =
        data.createdAt
          ? new Date(
              data.createdAt.seconds * 1000
            ).toLocaleDateString()
          : "Recent";

      newsList.innerHTML += `

        <div class="admin-news-card">

          ${
            data.imageUrl

            ? `
              <img
                src="${data.imageUrl}"
                alt="${data.title}"
              >
            `

            : ""
          }

          <div class="news-meta">
            ${date} • ${data.category || "General"}
          </div>

          <h3>
            ${data.title || "Untitled News"}
          </h3>

          <p>
            ${data.content || ""}
          </p>

          <button
            class="delete-btn"
            onclick="deleteNews('${newsDoc.id}')"
          >
            Delete News
          </button>

        </div>

      `;
    });

  } catch (error) {

    console.error(error);

    newsList.innerHTML = `
      <div class="empty">
        Failed to load news.
      </div>
    `;
  }
}

/* ================= DELETE NEWS ================= */

window.deleteNews = async function(id) {

  const confirmDelete = confirm(
    "Delete this news?"
  );

  if (!confirmDelete) return;

  try {

    await deleteDoc(doc(db, "news", id));

    loadNews();

  } catch (error) {

    console.error(error);

    alert("Failed to delete news.");
  }
};

loadNews();

</script>

</body>
</html>
