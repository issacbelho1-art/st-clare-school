<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add News - St Clare Admin</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f1ee;
  color: #222;
}

.admin-header {
  background: #7a1c2e;
  color: white;
  padding: 25px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.admin-header h1 {
  font-size: 26px;
  font-weight: 400;
}

.admin-header a {
  color: white;
  text-decoration: none;
  border: 1px solid white;
  padding: 10px 20px;
  border-radius: 30px;
}

.admin-header a:hover {
  background: white;
  color: #7a1c2e;
}

.news-admin {
  max-width: 900px;
  margin: 60px auto;
  background: white;
  padding: 45px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  border-left: 6px solid #7a1c2e;
}

.news-admin h2 {
  color: #7a1c2e;
  font-size: 32px;
  margin-bottom: 10px;
}

.news-admin p {
  color: #666;
  margin-bottom: 30px;
  line-height: 1.6;
}

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #ddd;
  font-size: 15px;
  outline: none;
  background: #faf7f5;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #7a1c2e;
  background: white;
}

.form-group textarea {
  height: 180px;
  resize: vertical;
}

button {
  background: #7a1c2e;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #4f101d;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.status-message {
  margin-top: 20px;
  padding: 14px;
  display: none;
}

.status-message.success {
  display: block;
  background: #e6f7e9;
  color: #1b7f35;
}

.status-message.error {
  display: block;
  background: #fdeaea;
  color: #a10000;
}

.published-news {
  margin-top: 60px;
}

.admin-news-card {
  background: #faf7f5;
  padding: 25px;
  margin-top: 20px;
  border-left: 5px solid #7a1c2e;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.admin-news-card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  margin-bottom: 18px;
  border-radius: 8px;
  display: block;
}

.admin-news-card h3 {
  margin-bottom: 10px;
  color: #7a1c2e;
}

.admin-news-card p {
  margin-bottom: 12px;
}

.news-meta {
  font-size: 13px;
  color: #777;
  margin-bottom: 15px;
}

.delete-btn {
  background: #b00020;
  margin-top: 10px;
}

.delete-btn:hover {
  background: #7a0014;
}

@media(max-width: 700px) {
  .admin-header {
    flex-direction: column;
    gap: 15px;
    text-align: center;
  }

  .news-admin {
    margin: 30px 15px;
    padding: 30px 20px;
  }
}

@media(max-width: 600px) {

  .news-admin h2 {
    font-size: 26px;
    line-height: 1.2;
  }

  .admin-news-card {
    padding: 20px 16px;
  }

  .admin-news-card img {
    height: 220px;
  }

  button {
    width: 100%;
  }

}
</style>
</head>

<body>

<header class="admin-header">
  <h1>St Clare News Admin</h1>
  <a href="admin.html">Back to Dashboard</a>
</header>

<section class="news-admin">
  <h2>Add News</h2>

  <p>
    Add school news, notices, announcements, events, or updates here.
    Once submitted, it will be saved in Firebase Firestore.
  </p>

  <form id="newsForm">

    <div class="form-group">
      <label for="title">News Title</label>
      <input 
        type="text" 
        id="title" 
        name="title" 
        placeholder="Example: Class 11 Admission Open"
        required
      >
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input 
        type="text" 
        id="category" 
        name="category" 
        placeholder="Example: Admission, Notice, Event"
      >
    </div>

    <div class="form-group">
      <label for="imageUrl">Image Path</label>
      <input
        type="text"
        id="imageUrl"
        name="imageUrl"
        placeholder="Example: images/class11-admission.jpg"
      >
    </div>

    <div class="form-group">
      <label for="content">News Content</label>
      <textarea 
        id="content" 
        name="content" 
        placeholder="Write the full news details here..."
        required
      ></textarea>
    </div>

    <button type="submit" id="submitBtn">Publish News</button>

    <div id="statusMessage" class="status-message"></div>

  </form>

  <div class="published-news">
    <h2>Published News</h2>

    <div id="newsList">
      Loading news...
    </div>
  </div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  query,
  orderBy,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC97WiF96Rx2_NH-6jz0vMP0LqyowgDMAc",
  authDomain: "st-clare-website.firebaseapp.com",
  projectId: "st-clare-website"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const newsForm = document.getElementById("newsForm");
const submitBtn = document.getElementById("submitBtn");
const statusMessage = document.getElementById("statusMessage");
const newsList = document.getElementById("newsList");

newsForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData(newsForm);

  const title = formData.get("title").trim();
  const category = formData.get("category").trim();
  const imageUrl = formData.get("imageUrl").trim();
  const content = formData.get("content").trim();

  if (!title || !content) {
    showMessage("Please fill in the title and content.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Publishing...";

  try {
    await addDoc(collection(db, "news"), {
      title: title,
      category: category || "General",
      imageUrl: imageUrl,
      content: content,
      status: "Published",
      createdAt: serverTimestamp()
    });

    showMessage("News published successfully!", "success");
    newsForm.reset();
    loadNews();

  } catch (error) {
    console.error("Error adding news:", error);
    showMessage("Failed to publish news. Please try again.", "error");

  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Publish News";
  }
});

function showMessage(message, type) {
  statusMessage.textContent = message;
  statusMessage.className = "status-message " + type;
}

async function loadNews() {
  try {
    const q = query(
      collection(db, "news"),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      newsList.innerHTML = `<p>No news published yet.</p>`;
      return;
    }

    newsList.innerHTML = "";

    snapshot.forEach((newsDoc) => {
      const data = newsDoc.data();

      const date = data.createdAt
        ? new Date(data.createdAt.seconds * 1000).toLocaleDateString()
        : "Recent";

      newsList.innerHTML += `
        <div class="admin-news-card">

          ${
            data.imageUrl
              ? `<img src="${data.imageUrl}" alt="${data.title || "School News"}">`
              : ""
          }

          <div class="news-meta">
            ${date} • ${data.category || "General"}
          </div>

          <h3>${data.title || "Untitled News"}</h3>

          <p>${data.content || ""}</p>

          <button
            class="delete-btn"
            onclick="deleteNews('${newsDoc.id}')"
          >
            Delete News
          </button>

        </div>
      `;
    });

  } catch (error) {
    console.error("Error loading news:", error);
    newsList.innerHTML = `<p>Failed to load news.</p>`;
  }
}

window.deleteNews = async function(id) {
  const confirmDelete = confirm("Are you sure you want to delete this news?");

  if (!confirmDelete) return;

  try {
    await deleteDoc(doc(db, "news", id));
    loadNews();
  } catch (error) {
    console.error("Delete error:", error);
    alert("Failed to delete news.");
  }
};

loadNews();

</script>

</body>
</html>
